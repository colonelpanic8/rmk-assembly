# fork-fold manifest: INTENT only -- which refs are tracked, in what order.
# manifest.lock.json records FACT: the OIDs the last build used and the
# assembled tree hash. The assembled branch is compiled output; never develop
# on it or merge it back.

[remotes]
upstream = "https://github.com/HaoboGu/rmk.git"
fork = "https://github.com/colonelpanic8/rmk"

[publish]
remote = "fork"
branch = "assembled"

[base]
remote = "upstream"
ref = "main"
# submodule = "upstream"  # optional: source base objects from this submodule path

# Entries merge in order onto the base. Three kinds:
#
# [[entry]]
# branch = "mine:some-topic"      # a live topic branch on a named remote
# pr = 1234                       # optional metadata: the PR this branch is
#                                 # published as (provenance link + dedup)
#
# [[entry]]
# pr = 1234                       # refs/pull/1234/head; remote = "upstream" by default
# fixup = "patches/example.patch" # optional coherence fixup: applied inside
#                                 # THIS entry's step, right after its merge,
#                                 # repairing what admitting it broke across
#                                 # the earlier entries. Keeps every entry
#                                 # boundary a coherent tree. Attach it with
#                                 # `fork-fold fixup ENTRY FILE --capture`.
#
# [[entry]]
# patch = "patches/example.patch" # a STANDALONE patch at its own position,
#                                 # for content belonging to no entry (e.g.
#                                 # site-local customization). Cross-entry
#                                 # repairs belong in a fixup instead.

# Targets deliberately NOT carried. Absence records nothing: `add --prs-from`
# re-appends every open PR it finds, so commenting an entry out is inert.
# An exclusion is the positive refusal, and the only form of it that survives
# a discovery sweep. Record one with `fork-fold exclude`; it never touches the
# lock, so nothing needs rebuilding.
#
# [[exclude]]
# pr = 1234                       # or branch = "mine:some-topic", or
#                                 # patch = "patches/example.patch"
# reason = "superseded by 1240, which already contains it"

[[entry]]
branch = "upstream:feat/rynk"
summary = "Rynk protocol + host stack (developed upstream, unmerged)"

[[entry]]
branch = "fork:fold/macro-hooks"
summary = "Macro host/runnable hooks; processor init after keymap"

[[entry]]
branch = "fork:fold/split-reliability"
summary = "BLE split reconnect fixes: shorter advertising grace, armed connect requests"

[[entry]]
branch = "fork:fold/lighting-rynk"
summary = "Glove80 lighting system + Rynk extensions (scenes, readback, build info, HID transport, split latency)"
note = "Based on upstream:feat/rynk; must follow it."

[[exclude]]
pr = 999
reason = "held modifier combinations landed upstream in f91b22a0"

[[exclude]]
branch = "fork:feat/rynk"
reason = "stale rebased copy of upstream:feat/rynk, which is carried instead"
