# fork-fold manifest: INTENT only -- which refs are tracked, in what order.
# manifest.lock.json records FACT: the OIDs the last build used and the
# assembled tree hash. The assembled branch is compiled output; never develop
# on it or merge it back.

[remotes]
upstream = "https://github.com/HaoboGu/rmk.git"
fork = "https://github.com/colonelpanic8/rmk"

[publish]
remote = "fork"
branch = "assembled"

[base]
remote = "upstream"
ref = "main"

[[entry]]
branch = "fork:fold/macro-hooks"
summary = "Macro host/runnable hooks; processor init after keymap"

[[entry]]
branch = "fork:fold/split-reliability"
summary = "BLE split reconnect fixes: shorter advertising grace, armed connect requests"

[[entry]]
branch = "fork:fold/lighting-rynk"
summary = "Glove80 lighting system + Rynk extensions (scenes, readback, build info, HID transport, split latency)"
note = "Was based on upstream:feat/rynk; rebased onto main after it merged in 9448f7a1."
fixup = "patches/lighting-rynk-coherence.patch"

[[entry]]
branch = "fork:fold/connection-selection"
summary = "Key-selectable output transport: OutputUsb/OutputBluetooth set preferred, profile switch prefers BLE, public connection status accessor"

[[entry]]
pr = 984
fixup = "patches/pr-984-lighting-coherence.patch"

[[entry]]
branch = "fork:feat/morse-retro-tap"

[[entry]]
branch = "fork:feat/morse-per-profile-prior-idle"

[[entry]]
branch = "fork:feat/morse-tap-unless-interrupted"

[[entry]]
branch = "fork:feat/morse-hold-trigger-positions"

[[entry]]
branch = "fork:feat/morse-hold-trigger-on-release"

[[exclude]]
pr = 999
reason = "held modifier combinations landed upstream in f91b22a0"

[[exclude]]
branch = "fork:feat/rynk"
reason = "stale copy of the rynk stack; upstream rebased and merged its own feat/rynk into main at 9448f7a1, so the base carries it now"
